services:
  web-app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: dzen_task-web-app
    ports:
      - "8000:8000"
    entrypoint: ["./entrypoint.sh"]
    env_file:
      - backend/.env
    environment:
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}

  redis:
    image: redis:8.8.3-alpine3.23
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --save 20 1 --loglevel warning
    volumes:
      - cache:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  celery:
    image: dzen_task-web-app
    command: "celery -A app worker -l info"
    depends_on:
      - web-app
      - redis
    restart: on-failure
    env_file:
      - backend/.env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - web-app

volumes:
  cache:
    driver: local