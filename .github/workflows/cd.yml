name: Deploy dzen_task to Zomro (Manual)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy code to Zomro via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "./*"
          target: "~/app/dzen_task/"

      # 2. Налаштовуємо оточення та запускаємо docker-compose-prod.yml
      - name: Run Application on Zomro
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/app/dzen_task
            
            # ВИПРАВЛЕНО: Створюємо .env безпосередньо всередині папки backend, 
            # оскільки ваш docker-compose-prod.yml очікує його саме там (backend/.env)
            mkdir -p backend
            echo "${{ secrets.PROD_ENV_FILE }}" > backend/.env            

            docker compose -f docker-compose-prod.yml up -d --build
            
            docker system prune -f
